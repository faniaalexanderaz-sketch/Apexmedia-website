name: Deploy sito su GitHub Pages

on:
  push:
    branches:
      - claude/install-frontend-design-skill-yzc2mg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir -p _site
          cp index.html styles.css main.js _site/
          [ -f .nojekyll ] && cp .nojekyll _site/ || touch _site/.nojekyll
          cp -r public _site/public

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pubblica su Pages
        id: deployment
        uses: actions/deploy-pages@v4
