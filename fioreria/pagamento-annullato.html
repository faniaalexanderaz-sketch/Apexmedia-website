<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pagamento annullato — Antica Fioreria del Centro</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Figtree:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Figtree:wght@400;500;600&display=swap" /></noscript>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="pagina-esito">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="sprig">
        <path d="M0 0C3-40 3-80 0-118" fill="none" stroke="var(--s, #7E9478)" stroke-width="2.4" stroke-linecap="round"/>
        <g fill="var(--l, #B9CBAF)">
          <ellipse rx="14" ry="5.5" transform="translate(-11,-24) rotate(-38)"/>
          <ellipse rx="14" ry="5.5" transform="translate(12,-42) rotate(34)"/>
          <ellipse rx="13" ry="5" transform="translate(-11,-62) rotate(-38)"/>
          <ellipse rx="12" ry="4.6" transform="translate(11,-80) rotate(34)"/>
          <ellipse rx="10" ry="4" transform="translate(-8,-98) rotate(-36)"/>
        </g>
      </g>
    </defs>
  </svg>

  <main class="esito">
    <figure class="esito-art esito-art-sm" aria-hidden="true">
      <svg viewBox="0 0 120 140" class="bq">
        <g class="sway sw2" style="--pivot:60px 132px">
          <use href="#sprig" transform="translate(60,128)" style="--s:#9CAF94; --l:#D6E2CC"/>
        </g>
      </svg>
    </figure>

    <p class="eyebrow">Pagamento annullato</p>
    <h1 class="display">Nessun addebito, <em>nessun problema</em>.</h1>
    <p class="lede">Il pagamento non è andato a buon fine o è stato annullato. Il tuo carrello è rimasto com'era: puoi riprovare quando vuoi.</p>

    <div class="esito-azioni">
      <a class="btn btn-primary btn-lg" href="index.html?carrello=1">Torna al carrello</a>
      <a class="btn btn-ghost" href="index.html">Torna alla fioreria</a>
    </div>
  </main>
</body>
</html>
