<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Traccia il tuo ordine — Antica Fioreria del Centro</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="favicon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="pagina-account">

  <header class="nav">
    <a class="brand" href="index.html" aria-label="Antica Fioreria del Centro, torna alla home">
      <img class="brand-logo" src="foto/logo-orizzontale.jpg" alt="Antica Fioreria del Centro" />
    </a>
    <a class="btn btn-ghost btn-sm" href="index.html">← Torna alla fioreria</a>
  </header>

  <main class="account">

    <!-- ============ RICERCA ============ -->
    <section class="auth-card" id="cardRicerca">
      <h2 class="auth-sub">Traccia il tuo <em>ordine</em></h2>
      <p class="body-text">Inserisci il numero d'ordine (lo trovi nell'email di conferma) e l'email usata per l'acquisto.</p>
      <form class="auth-form" id="formTraccia" novalidate>
        <div class="field">
          <label for="trNumero">Numero ordine</label>
          <input id="trNumero" type="text" autocapitalize="characters" placeholder="es. 3-11OBYT" required />
          <p class="field-err" hidden></p>
        </div>
        <div class="field">
          <label for="trEmail">Email dell'ordine</label>
          <input id="trEmail" type="email" autocomplete="email" required />
          <p class="field-err" hidden></p>
        </div>
        <p class="form-msg" id="trMsg" role="alert" hidden></p>
        <button class="btn btn-primary btn-lg" type="submit" id="trBtn">Cerca il mio ordine</button>
      </form>
    </section>

    <!-- ============ RISULTATO ============ -->
    <section class="auth-card traccia-risultato" id="cardRisultato" hidden>
      <h2 class="auth-sub">Ordine <em id="trNumeroMostrato"></em></h2>
      <p class="body-text" id="trData"></p>

      <ol class="traccia-timeline" id="trTimeline" aria-label="Stato dell'ordine">
        <li class="traccia-step" data-stato="ricevuto"><span class="traccia-punto" aria-hidden="true"></span><span class="traccia-testo">Ricevuto</span></li>
        <li class="traccia-step" data-stato="in_preparazione"><span class="traccia-punto" aria-hidden="true"></span><span class="traccia-testo">In preparazione</span></li>
        <li class="traccia-step" data-stato="spedito"><span class="traccia-punto" aria-hidden="true"></span><span class="traccia-testo">Spedito</span></li>
        <li class="traccia-step" data-stato="consegnato"><span class="traccia-punto" aria-hidden="true"></span><span class="traccia-testo">Consegnato</span></li>
      </ol>

      <div class="riepilogo traccia-riepilogo">
        <h2 class="riepilogo-titolo">Il tuo acquisto</h2>
        <ul class="riepilogo-lista" id="trLista"></ul>
        <div class="riepilogo-totale"><span>Totale</span><strong id="trTotale"></strong></div>
      </div>

      <button class="link-btn traccia-nuova-ricerca" type="button" id="trNuovaRicerca">← Cerca un altro ordine</button>
    </section>

  </main>

  <script src="cookie.js"></script>
  <script src="traccia-ordine.js"></script>

</body>
</html>
