  <main class="esito">

    <p class="eyebrow">Ordine confermato</p>
    <h1 class="display">Grazie per il tuo <em>ordine</em>.</h1>
    <p class="lede">La tua composizione viene imballata con cura e affidata al corriere: in 48/72 ore è da te, perfetta come in bottega.</p>

    <div class="riepilogo" id="riepilogo" hidden>
      <h2 class="riepilogo-titolo">Il tuo acquisto</h2>
      <ul class="riepilogo-lista" id="riepilogoLista"></ul>
      <div class="riepilogo-totale"><span>Totale</span><strong id="riepilogoTotale"></strong></div>
    </div>

    <p class="esito-nota">Riceverai a breve un'email di conferma con il riepilogo del tuo ordine.</p>
    <a class="btn btn-primary btn-lg" href="index.html">Torna alla fioreria</a>
  </main>

  <script src="cookie.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      /* riepilogo: dall'ordine pending (con sconto) o dal carrello */
      var ordine = null;
      try { ordine = JSON.parse(localStorage.getItem('afc-ordine-pending')); } catch (e) {}
      if (!ordine) {
        var cart = [];
        try { cart = JSON.parse(localStorage.getItem('afc-cart') || '[]'); } catch (e) {}
        if (cart.length) {
          ordine = {
            items: cart,
            totale: cart.reduce(function (s, r) { return s + r.prezzo * r.qty; }, 0),
            sconto: 0, coupon: null, data: new Date().toISOString()
          };
        }
      }

      if (ordine && ordine.items.length) {
        var lista = document.getElementById('riepilogoLista');
        ordine.items.forEach(function (r) {
          var li = document.createElement('li');
          li.innerHTML = '<span class="ri-nome"></span><span class="ri-prezzo">' +
            r.qty + ' × € ' + r.prezzo + '</span>';
          li.querySelector('.ri-nome').textContent = r.nome;
          lista.appendChild(li);
        });
        if (ordine.spedizione) {
          var liSped = document.createElement('li');
          liSped.innerHTML = '<span class="ri-nome">Spedizione assicurata</span><span class="ri-prezzo">€ ' + ordine.spedizione + '</span>';
          lista.appendChild(liSped);
        }
        var t = ordine.totale;
        var tot = '€ ' + (Number.isInteger(t) ? t : t.toFixed(2).replace('.', ','));
        if (ordine.sconto) tot += ' (coupon −' + ordine.sconto + '%)';
        document.getElementById('riepilogoTotale').textContent = tot;
        document.getElementById('riepilogo').hidden = false;

        /* registra nello storico dell'account e consuma il coupon */
        if (typeof AFC !== 'undefined' && AFC.utenteCorrente()) {
          AFC.registraOrdine(ordine);
          if (ordine.coupon) AFC.segnaCouponUsato(ordine.coupon);
        }

        /* evento di acquisto per Google Ads/Analytics (via Tag Manager) —
           parte solo se l'utente ha accettato i cookie di misurazione */
        if (typeof AFC_COOKIE !== 'undefined') {
          var m = location.search.match(/[?&]sessione=([^&]+)/);
          AFC_COOKIE.dataLayerPush({
            event: 'purchase',
            ecommerce: {
              transaction_id: m ? m[1] : String(Date.now()),
              value: t,
              currency: 'EUR',
              items: ordine.items.map(function (r) {
                return { item_name: r.nome, price: r.prezzo, quantity: r.qty };
              })
            }
          });
        }
      }

      /* ordine concluso: si riparte puliti */
      localStorage.removeItem('afc-cart');
      localStorage.removeItem('afc-ordine-pending');
      localStorage.removeItem('afc-coupon-attivo');
    })();
  </script>
