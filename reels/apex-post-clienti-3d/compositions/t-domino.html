    (function () {
      const B = 60 / 140;
      const tl = gsap.timeline({ paused: true });
      const step = 3 * B;

      [0, 1, 2].forEach((i) => {
        const t0 = i * step;
        tl.fromTo(".dm-c" + i, { rotationY: 95, z: -400, opacity: 0 }, { rotationY: 0, z: 0, opacity: 1, duration: 0.2, ease: "expo.out", stagger: 0.016 }, t0 + 0.02);

      const n = { v: 1 };
      tl.fromTo("#dm-nn", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.02);
      tl.fromTo(n, { v: 0 }, { v: 3 * step, duration: 3 * step, ease: "none", onUpdate: () => (cnt.textContent = Math.min(3, Math.floor(n.v / step + 0.02) + 1) + " / 4") }, 0);
