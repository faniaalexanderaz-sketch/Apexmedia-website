      <svg viewBox="0 0 860 960" width="860" height="960" style="position:absolute;left:110px;top:560px" data-layout-allow-overlap><rect x="10" y="10" width="840" height="880" rx="30" fill="#fff" stroke="#111111" stroke-width="12"/><rect x="90" y="110" width="200" height="100" rx="18" fill="#dfe8f2"/><text x="190" y="172" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="34" fill="#0058a3">novità</text><rect x="570" y="110" width="200" height="100" rx="18" fill="#dfe8f2"/><text x="670" y="172" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="34" fill="#0058a3">più venduti</text><rect x="330" y="420" width="200" height="100" rx="18" fill="#dfe8f2"/><text x="430" y="482" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="34" fill="#0058a3">offerte</text><rect x="90" y="640" width="200" height="100" rx="18" fill="#dfe8f2"/><text x="190" y="702" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="34" fill="#0058a3"></text><rect x="570" y="640" width="200" height="100" rx="18" fill="#dfe8f2"/><text x="670" y="702" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="34" fill="#0058a3"></text><rect x="90" y="870" width="140" height="40" fill="#fff"/><text x="160" y="950" text-anchor="middle" font-family="SF Pro Display" font-weight="700" font-size="36" fill="#111111">entrata</text><rect x="640" y="800" width="180" height="70" rx="14" fill="#ffdb00"/><text x="730" y="848" text-anchor="middle" font-family="SF Pro Display" font-weight="800" font-size="34" fill="#111111">cassa</text><path id="r-m" d="M160 880 C 330 700, 60 520, 380 600 S 760 330, 520 250 S 160 400, 640 640 S 820 760, 560 820 S 300 560, 460 380" fill="none" stroke="#e30000" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 26"/><path id="r-x" d="M200 200 L660 660 M660 200 L200 660" fill="none" stroke="#e30000" stroke-width="30" stroke-linecap="round"/></svg>

  <script>

    /* split .split into letters and .wsplit into words once, before the timeline is built */
    document.querySelectorAll(".split:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const txt = el.textContent; el.textContent = ""; for (const c of txt) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); } });
    document.querySelectorAll(".wsplit:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const parts = el.textContent.split(" "); el.textContent = ""; parts.forEach((p, k) => { const s = document.createElement("span"); s.className = "w"; s.textContent = p + (k < parts.length - 1 ? " " : ""); el.appendChild(s); }); });
    const L = (sel) => document.querySelectorAll(sel + " .ch");
    const W = (sel) => document.querySelectorAll(sel + " .w");
    const eur = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const flip = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0, y: 46, rotation: -24, scale: 0.55, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.32, ease: "back.out(2.4)", stagger: st || 0.022 }, t);
    const rise = (tl, sel, t) => tl.fromTo(sel, { yPercent: 135 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, t);
    const sink = (tl, sel, t) => tl.to(sel, { yPercent: -150, duration: 0.2, ease: "power3.in" }, t);
    /* words arrive one after another out of a soft blur, with no travel (the premium title entrance) */
    const wordsIn = (tl, sel, t, st) => tl.fromTo(W(sel), { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: st || 0.07 }, t);
    const blurIn = (tl, sel, t, d) => tl.fromTo(sel, { opacity: 0, filter: "blur(18px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: d || 0.3, ease: "power2.out" }, t);
    const blurOut = (tl, sel, t, d) => tl.to(sel, { opacity: 0, filter: "blur(16px)", duration: d || 0.16, ease: "power2.in" }, t);
    const typeIn = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: st || 0.035 }, t);
    const pop = (tl, sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.4)" }, t);
    const punch = (tl, sel, t, k) => tl.fromTo(sel, { scale: k || 1.1 }, { scale: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, t);
    const shake = (tl, sel, t, k) => tl.fromTo(sel, { x: -(k || 18) }, { x: 0, duration: 0.32, ease: "elastic.out(1.3, 0.3)", immediateRender: false }, t);
    const count = (tl, sel, a, b, t, d, fmt, ease) => { const o = { v: a }; const el = document.querySelector(sel); const f = fmt || eur; const u = () => { el.textContent = f(o.v); }; tl.to(o, { v: b, duration: d, ease: ease || "expo.out", onUpdate: u }, t); };
    const draw = (tl, sel, t, d) => { document.querySelectorAll(sel).forEach((el) => { const n = el.getTotalLength ? el.getTotalLength() : 1000; el.style.strokeDasharray = n + " " + (n + 60); tl.fromTo(el, { strokeDashoffset: n + 30 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, t); }); };
    const flash = (tl, sel, t, k) => tl.fromTo(sel, { opacity: k || 0.9 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
    /* scene transitions: U/D/L/R push, Z zoom, B blur-zoom through, N hard cut */
    const enter = (tl, sel, k) => k === "N" ? tl
      : k === "W" ? tl.fromTo(sel, { x: 1080, skewX: -14, filter: "blur(30px)" }, { x: 0, skewX: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, 0)
      : k === "I" ? tl.fromTo(sel, { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(120% at 50% 50%)", duration: 0.38, ease: "power3.out" }, 0)
      : k === "S" ? tl.fromTo(sel, { rotation: -14, scale: 1.5, opacity: 0, filter: "blur(20px)" }, { rotation: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "expo.out" }, 0)
      : k === "K" ? tl.fromTo(sel, { clipPath: "inset(0% 0% 100% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "expo.out" }, 0)
      : k === "B" ? tl.fromTo(sel, { scale: 0.8, opacity: 0, filter: "blur(26px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0)
      : k === "Z" ? tl.fromTo(sel, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0)
      : k === "U" ? tl.fromTo(sel, { y: 1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "D" ? tl.fromTo(sel, { y: -1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "R" ? tl.fromTo(sel, { x: -1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0)
      : tl.fromTo(sel, { x: 1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0);
    const exit = (tl, sel, k, t) => k === "N" ? tl
      : k === "W" ? tl.to(sel, { x: -1080, skewX: 14, filter: "blur(30px)", duration: 0.2, ease: "power3.in" }, t)
      : k === "I" ? tl.to(sel, { scale: 0.86, opacity: 0.4, duration: 0.2, ease: "power3.in" }, t)
      : k === "S" ? tl.to(sel, { rotation: 12, scale: 0.6, opacity: 0, filter: "blur(16px)", duration: 0.2, ease: "power3.in" }, t)
      : k === "K" ? tl.to(sel, { y: -260, opacity: 0, duration: 0.2, ease: "power3.in" }, t)
      : k === "B" ? tl.to(sel, { scale: 1.35, opacity: 0, filter: "blur(26px)", duration: 0.2, ease: "power3.in" }, t)
      : k === "Z" ? tl.to(sel, { scale: 1.3, opacity: 0, duration: 0.18, ease: "power3.in" }, t)
      : k === "U" ? tl.to(sel, { y: -1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "D" ? tl.to(sel, { y: 1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "R" ? tl.to(sel, { x: 1080, duration: 0.2, ease: "power3.in" }, t)
      : tl.to(sel, { x: -1080, duration: 0.2, ease: "power3.in" }, t);
    /* 3D world camera. The camera orbits a target point (x, y, z) at distance d with angles rx, ry, rz.
       camPath(tl, "#world", K) takes contiguous keyframes K = [[t, {x,y,z,d,rx,ry,rz}, ease], ...] and tweens between them,
       so at any time exactly one segment drives the camera (seek-safe). */
    const camSet = (w, c) => { w.style.transform = "translateZ(" + (-c.d) + "px) rotateZ(" + c.rz + "deg) rotateX(" + c.rx + "deg) rotateY(" + c.ry + "deg) translate3d(" + (-c.x) + "px," + (-c.y) + "px," + (-c.z) + "px)"; };
    const camPath = (tl, sel, K) => { const w = document.querySelector(sel); const D = { x: 0, y: 0, z: 0, d: 0, rx: 0, ry: 0, rz: 0 };
      const full = K.map((k) => Object.assign({}, D, k[1])); const eases = K.map((k) => gsap.parseEase(k[2] || "power2.inOut"));
      const at = (t) => { if (t <= K[0][0]) return full[0]; const n = K.length - 1; if (t >= K[n][0]) return full[n];
        let i = 0; while (i < n - 1 && t >= K[i + 1][0]) i++; const p = eases[i + 1]((t - K[i][0]) / (K[i + 1][0] - K[i][0])); const c = {};
        for (const k in D) c[k] = full[i][k] + (full[i + 1][k] - full[i][k]) * p; return c; };
      const clock = { t: 0 }; camSet(w, at(0));
      tl.fromTo(clock, { t: K[0][0] }, { t: K[K.length - 1][0], duration: K[K.length - 1][0] - K[0][0], ease: "none", immediateRender: true, onUpdate: () => camSet(w, at(clock.t)) }, K[0][0]); };
    /* glitch: quick colour split and jitter on a title */
    const glitch = (tl, sel, t) => { tl.fromTo(sel, { x: -14, textShadow: "6px 0 #ff2d55, -6px 0 #00e5ff" }, { x: 0, textShadow: "0px 0 rgba(0,0,0,0), 0px 0 rgba(0,0,0,0)", duration: 0.28, ease: "steps(6)", immediateRender: false }, t); };
    /* stamp: drops in big and rotated, lands with a bounce */
    const stamp = (tl, sel, t, r) => tl.fromTo(sel, { opacity: 0, scale: 2.6, rotation: (r || -10) - 18 }, { opacity: 1, scale: 1, rotation: r || -10, duration: 0.26, ease: "power4.in" }, t);
    /* the foldable: one angle drives the hinge (0 = open flat, 180 = closed), the shading of the moving half and the re-centring of the whole phone */
    const duoSet = (id, a) => { const r = a * Math.PI / 180; const c = Math.cos(r);
      gsap.set(id + "-l", { rotationY: a });
      gsap.set(id + "-g", { x: -175 * (1 - c) });
      const li = document.querySelector(id + "-li"), lo = document.querySelector(id + "-lo");
      if (li) li.style.filter = "brightness(" + (0.55 + 0.45 * Math.max(0, c)).toFixed(3) + ")";
      if (lo) lo.style.filter = "brightness(" + (0.6 + 0.4 * Math.max(0, -c)).toFixed(3) + ")";
      const sh = document.querySelector(id + "-sh"); if (sh) sh.style.transform = "scaleX(" + (0.5 + 0.5 * (1 + c) / 2).toFixed(3) + ")"; };
    const fold = (tl, id, a0, a1, t, d, ease) => { const o = { a: a0 }; tl.to(o, { a: a1, duration: d, ease: ease || "power3.inOut", onUpdate: () => duoSet(id, o.a) }, t); };

    const tl = gsap.timeline({ paused: true });
    enter(tl, "#i15-st", "S");
    tl.fromTo("#i15-cam", { scale: 1.0, rotationY: -2.2, rotationX: -1.6 }, { scale: 1.08, rotationY: 2.6, rotationX: 0.6, duration: 3.02, ease: "sine.inOut" }, 0);
    tl.fromTo("#i15-bg i", { x: 260, y: -180 }, { x: -260, y: 220, duration: 3.02, ease: "none", stagger: 0 }, 0);
    tl.fromTo("#r-a", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.24 }, 0.81 - 0.2);
    tl.fromTo("#r-b", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.81 + 0.4);
    tl.fromTo("#r-m", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 0.81);
    tl.fromTo("#r-m", { strokeDashoffset: 0 }, { strokeDashoffset: -280, duration: 3.02, ease: "none" }, 0);
    draw(tl, "#r-x", 2.32 - 0.1, 0.3);
    exit(tl, "#i15-st", "L", 2.85);
    window.__timelines["i15"] = tl;
  </script>
