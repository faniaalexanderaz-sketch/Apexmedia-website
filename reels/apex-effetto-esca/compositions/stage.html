          if (b > 0) { const k = pop(t, 20.44); txt3("VENDITE ↑", XL - 150, 480, 0, 104 * k, HOT); for (let i = 0; i < 2; i++) { const r = seg(t, 20.44 + i * 0.15, 21.2 + i * 0.15); if (r > 0 && r < 1) { c.save(); c.globalAlpha *= 1 - r; ring3(XL, 2, 0, 100 + r * 520, i ? HOT : WH, 4); c.restore(); } } }

        [21.5, 27.25, (t) => { // Si chiama effetto esca. Un'opzione messa lì apposta, per farti scegliere un'altra.

          if (t > 22.9) tag("ESCA", hx, hy - 110, 0, HOT, pop(t, 22.9) * 0.9);
