<template>
  <style>

    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Regular.otf") format("opentype"), url("assets/fonts/InterDisplay-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Medium.otf") format("opentype"), url("assets/fonts/InterDisplay-Medium.otf") format("opentype"); font-weight: 500; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Semibold.otf") format("opentype"), url("assets/fonts/InterDisplay-SemiBold.otf") format("opentype"); font-weight: 600; font-style: normal; }
    @font-face { font-family: "SF Pro Display"; src: url("assets/fonts/SF-Pro-Display-Bold.otf") format("opentype"), url("assets/fonts/InterDisplay-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; }
    #root { position: absolute; inset: 0; background: #fff; overflow: hidden; font-family: "SF Pro Display"; color: #1d1d1f; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
    .st { position: absolute; inset: 0; background: #fff; overflow: hidden; perspective: 1700px; }
    /* moving light behind every graphic scene, and an optional giant outlined word drifting across */
    .bgfx { position: absolute; inset: -200px; pointer-events: none; }
    .bgfx i { position: absolute; display: block; width: 1300px; height: 1300px; border-radius: 50%; }
    .bgfx i:nth-child(1) { left: -300px; top: 100px; background: radial-gradient(closest-side, rgba(0,113,227,0.14), rgba(0,113,227,0)); }
    .bgfx i:nth-child(2) { left: 500px; top: 1100px; background: radial-gradient(closest-side, rgba(122,15,36,0.13), rgba(122,15,36,0)); }
    .dark .bgfx i:nth-child(1) { background: radial-gradient(closest-side, rgba(41,151,255,0.30), rgba(41,151,255,0)); }
    .dark .bgfx i:nth-child(2) { background: radial-gradient(closest-side, rgba(191,36,72,0.30), rgba(191,36,72,0)); }
    .mq { position: absolute; left: 0; top: 1180px; white-space: nowrap; font: 700 460px/1 "SF Pro Display"; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 4px rgba(0,0,0,0.07); pointer-events: none; }
    .dark .mq { -webkit-text-stroke: 4px rgba(255,255,255,0.11); }
    .st.grey { background: #f5f5f7; }
    .st.dark { background: #000; color: #f5f5f7; }
    .cam { position: absolute; inset: 0; background: inherit; transform-origin: 50% 46%; }
    .zone { z-index: 5; position: absolute; left: 70px; right: 70px; top: 360px; text-align: center; }
    .line { display: block; overflow: hidden; padding: 8px 0 16px; font: 600 84px/1.06 "SF Pro Display"; letter-spacing: -0.022em; }
    .line > span { display: inline-block; }
    .t { font: 600 84px/1.06 "SF Pro Display"; letter-spacing: -0.022em; }
    .tb { font: 700 120px/1.02 "SF Pro Display"; letter-spacing: -0.035em; }
    .mut { color: #86868b; }
    .dark .mut { color: #a1a1a6; }
    .acc { color: #7a0f24; }
    .blue { color: #0071e3; }
    .eyebrow { position: absolute; left: 0; right: 0; text-align: center; font: 600 34px/1 "SF Pro Display"; letter-spacing: -0.01em; color: #b64400; opacity: 0; }
    .grad { background: linear-gradient(100deg, #6e7fb8 0%, #1d2a57 38%, #7b8fd0 62%, #1a2244 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .ch { display: inline-block; white-space: pre; }
    .w { display: inline-block; white-space: pre; }
    .hl { position: relative; display: inline-block; }
    .hl > i { position: absolute; left: -10px; right: -10px; top: 8%; bottom: 4%; background: rgba(255, 214, 10, 0.5); border-radius: 10px; transform-origin: left center; }
    .hl > span { position: relative; }
    .vid { position: absolute; inset: 0; overflow: hidden; }
    .vid video, .vid img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.42) 30%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.25) 100%); }
    .card { position: absolute; border-radius: 40px; background: #fff; box-shadow: 0 40px 100px -30px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.04); }
    .chip { position: absolute; padding: 18px 34px; border-radius: 999px; background: #1d1d1f; color: #fff; font: 600 44px/1 "SF Pro Display"; letter-spacing: -0.015em; white-space: nowrap; opacity: 0; }
    .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 40; }
    .cur { position: absolute; width: 60px; height: 60px; opacity: 0; z-index: 30; }
    /* --- the foldable, built from four flat textures on two hinged halves --- */
    .duo { position: absolute; width: 1400px; height: 1037px; perspective: 3400px; transform-origin: 50% 50%; }
    .duo-g { position: absolute; inset: 0; transform-style: preserve-3d; }
    .duo-h { position: absolute; top: 0; width: 700px; height: 1037px; transform-style: preserve-3d; }
    .duo-r { left: 700px; }
    .duo-l { left: 0; transform-origin: 100% 50%; }
    .duo .f { position: absolute; inset: 0; background-size: 100% 100%; backface-visibility: hidden; }
    .duo .f.out { transform: rotateY(180deg) translateZ(10px); }
    .duo-sh { position: absolute; left: 50%; top: 1037px; width: 1400px; height: 90px; margin-left: -700px; background: radial-gradient(closest-side, rgba(0,0,0,0.34), rgba(0,0,0,0)); transform-origin: 50% 50%; }

    #root { background: #000 !important; }

    .rp { position: absolute; left: 390px; top: 1300px; display: block; width: 300px; height: 90px; border-radius: 50%; border: 6px solid #2997ff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="b20" data-width="1080" data-height="1920">
    <div id="b20-st" class="st dark" data-layout-allow-overlap>
<div id="b20-cam" class="cam" data-layout-allow-overlap>
      <div class="bgfx" id="b20-bg" data-layout-allow-overlap><i></i><i></i></div>
      <div id="k-a" style="position:absolute;left:0;right:0;top:330px;text-align:center;font:600 62px/1.1 'SF Pro Display';letter-spacing:-0.02em;color:#a1a1a6;" data-layout-allow-overlap>si chiama</div>
      <div id="k-b" style="position:absolute;left:0;right:0;top:410px;text-align:center;font:700 150px/1.05 'SF Pro Display';letter-spacing:-0.045em;color:#f5f5f7;" data-layout-allow-overlap>Effetto</div>
      <div id="k-c" style="position:absolute;left:0;right:0;top:560px;text-align:center"><span class="split" id="k-cw" style="font:700 216px/1.05 'SF Pro Display';letter-spacing:-0.045em;color:#2997ff;display:inline-block">àncora.</span></div>
      <div style="position:absolute;left:0;top:830px;width:1080px;height:1090px;overflow:hidden" data-layout-allow-overlap><svg id="k-an" viewBox="0 0 200 1200" width="330" height="1980" style="position:absolute;left:375px;top:-1390px;overflow:visible" fill="none" stroke="#f5f5f7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
        <path d="M100 0 V962" stroke-dasharray="4 26" stroke="#6e6e73"/>
        <circle cx="100" cy="986" r="22"/><path d="M100 1008 V1180"/><path d="M62 1050 H138"/>
        <path d="M26 1100 C26 1158 68 1184 100 1184 C132 1184 174 1158 174 1100"/><path d="M26 1100 L10 1128 M26 1100 L52 1116 M174 1100 L190 1128 M174 1100 L148 1116"/>
      </svg></div>
      <i class="rp" id="k-r1"></i><i class="rp" id="k-r2"></i>
      <div id="k-src" style="position:absolute;left:0;right:0;top:1450px;text-align:center;font:600 34px/1.1 'SF Pro Display';letter-spacing:-0.02em;color:#86868b;" data-layout-allow-overlap>Tversky e Kahneman, 1974</div>
    </div>
    </div>
  </div>
  <script>

    /* split .split into letters and .wsplit into words once, before the timeline is built */
    document.querySelectorAll(".split:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const txt = el.textContent; el.textContent = ""; for (const c of txt) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); } });
    document.querySelectorAll(".wsplit:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const parts = el.textContent.split(" "); el.textContent = ""; parts.forEach((p, k) => { const s = document.createElement("span"); s.className = "w"; s.textContent = p + (k < parts.length - 1 ? " " : ""); el.appendChild(s); }); });
    const L = (sel) => document.querySelectorAll(sel + " .ch");
    const W = (sel) => document.querySelectorAll(sel + " .w");
    const eur = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const flip = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0, y: 46, rotation: -24, scale: 0.55, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.32, ease: "back.out(2.4)", stagger: st || 0.022 }, t);
    const rise = (tl, sel, t) => tl.fromTo(sel, { yPercent: 135 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, t);
    const sink = (tl, sel, t) => tl.to(sel, { yPercent: -150, duration: 0.2, ease: "power3.in" }, t);
    /* words arrive one after another out of a soft blur, with no travel (the premium title entrance) */
    const wordsIn = (tl, sel, t, st) => tl.fromTo(W(sel), { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: st || 0.07 }, t);
    const blurIn = (tl, sel, t, d) => tl.fromTo(sel, { opacity: 0, filter: "blur(18px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: d || 0.3, ease: "power2.out" }, t);
    const blurOut = (tl, sel, t, d) => tl.to(sel, { opacity: 0, filter: "blur(16px)", duration: d || 0.16, ease: "power2.in" }, t);
    const typeIn = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: st || 0.035 }, t);
    const pop = (tl, sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.4)" }, t);
    const punch = (tl, sel, t, k) => tl.fromTo(sel, { scale: k || 1.1 }, { scale: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, t);
    const shake = (tl, sel, t, k) => tl.fromTo(sel, { x: -(k || 18) }, { x: 0, duration: 0.32, ease: "elastic.out(1.3, 0.3)", immediateRender: false }, t);
    const count = (tl, sel, a, b, t, d, fmt, ease) => { const o = { v: a }; const el = document.querySelector(sel); const f = fmt || eur; const u = () => { el.textContent = f(o.v); }; tl.to(o, { v: b, duration: d, ease: ease || "expo.out", onUpdate: u }, t); };
    const draw = (tl, sel, t, d) => { document.querySelectorAll(sel).forEach((el) => { const n = el.getTotalLength ? el.getTotalLength() : 1000; el.style.strokeDasharray = n + " " + (n + 60); tl.fromTo(el, { strokeDashoffset: n + 30 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, t); }); };
    const flash = (tl, sel, t, k) => tl.fromTo(sel, { opacity: k || 0.9 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
    /* scene transitions: U/D/L/R push, Z zoom, B blur-zoom through, N hard cut */
    const enter = (tl, sel, k) => k === "N" ? tl
      : k === "B" ? tl.fromTo(sel, { scale: 0.8, opacity: 0, filter: "blur(26px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0)
      : k === "Z" ? tl.fromTo(sel, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0)
      : k === "U" ? tl.fromTo(sel, { y: 1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "D" ? tl.fromTo(sel, { y: -1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "R" ? tl.fromTo(sel, { x: -1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0)
      : tl.fromTo(sel, { x: 1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0);
    const exit = (tl, sel, k, t) => k === "N" ? tl
      : k === "B" ? tl.to(sel, { scale: 1.35, opacity: 0, filter: "blur(26px)", duration: 0.2, ease: "power3.in" }, t)
      : k === "Z" ? tl.to(sel, { scale: 1.3, opacity: 0, duration: 0.18, ease: "power3.in" }, t)
      : k === "U" ? tl.to(sel, { y: -1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "D" ? tl.to(sel, { y: 1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "R" ? tl.to(sel, { x: 1080, duration: 0.2, ease: "power3.in" }, t)
      : tl.to(sel, { x: -1080, duration: 0.2, ease: "power3.in" }, t);
    /* the foldable: one angle drives the hinge (0 = open flat, 180 = closed), the shading of the moving half and the re-centring of the whole phone */
    const duoSet = (id, a) => { const r = a * Math.PI / 180; const c = Math.cos(r);
      gsap.set(id + "-l", { rotationY: a });
      gsap.set(id + "-g", { x: -175 * (1 - c) });
      const li = document.querySelector(id + "-li"), lo = document.querySelector(id + "-lo");
      if (li) li.style.filter = "brightness(" + (0.55 + 0.45 * Math.max(0, c)).toFixed(3) + ")";
      if (lo) lo.style.filter = "brightness(" + (0.6 + 0.4 * Math.max(0, -c)).toFixed(3) + ")";
      const sh = document.querySelector(id + "-sh"); if (sh) sh.style.transform = "scaleX(" + (0.5 + 0.5 * (1 + c) / 2).toFixed(3) + ")"; };
    const fold = (tl, id, a0, a1, t, d, ease) => { const o = { a: a0 }; tl.to(o, { a: a1, duration: d, ease: ease || "power3.inOut", onUpdate: () => duoSet(id, o.a) }, t); };

    const tl = gsap.timeline({ paused: true });
    enter(tl, "#b20-st", "D");
    tl.fromTo("#b20-cam", { scale: 1.07, rotationY: 3.0, rotationX: -1.2 }, { scale: 1.0, rotationY: -2.2, rotationX: 1.6, duration: 1.41, ease: "sine.inOut" }, 0);
    tl.fromTo("#b20-bg i", { x: -260, y: 180 }, { x: 260, y: -220, duration: 1.41, ease: "none", stagger: 0 }, 0);
    tl.fromTo("#k-b", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.55 - 0.2);
    flip(tl, "#k-cw", 0.98 - 0.14, 0.03);
    tl.fromTo("#k-an", { y: -1500 }, { y: 0, duration: 0.42, ease: "power3.in" }, 0.98 - 0.36);
    tl.to("#k-an", { y: -46, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 0.98 + 0.06);
    shake(tl, "#b20-cam", 0.98 + 0.06, 22);
    ["#k-r1", "#k-r2"].forEach((r, k) => tl.fromTo(r, { opacity: 0.8, scale: 0.2 }, { opacity: 0, scale: 3.2, duration: 0.6, ease: "power2.out" }, 0.98 + 0.08 + k * 0.14));
    tl.fromTo("#k-src", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.98 + 0.1);
    exit(tl, "#b20-st", "Z", 1.24);
    window.__timelines["b20"] = tl;
  </script>
</template>
