  <style>

    .dark .bgfx i:nth-child(2) { background: radial-gradient(closest-side, rgba(191,36,72,0.30), rgba(191,36,72,0)); }
    .mq { position: absolute; left: 0; top: 1180px; white-space: nowrap; font: 700 460px/1 "SF Pro Display"; letter-spacing: -0.04em; color: transparent; -webkit-text-stroke: 4px rgba(0,0,0,0.07); pointer-events: none; }
    .dark .mq { -webkit-text-stroke: 4px rgba(255,255,255,0.11); }

    .chip { position: absolute; padding: 18px 34px; border-radius: 999px; background: #1d1d1f; color: #fff; font: 600 44px/1 "SF Pro Display"; letter-spacing: -0.015em; white-space: nowrap; opacity: 0; }

    .cur { position: absolute; width: 60px; height: 60px; opacity: 0; z-index: 30; }
    /* --- the foldable, built from four flat textures on two hinged halves --- */
    .duo { position: absolute; width: 1400px; height: 1037px; perspective: 3400px; transform-origin: 50% 50%; }
    .duo-g { position: absolute; inset: 0; transform-style: preserve-3d; }
    .duo-h { position: absolute; top: 0; width: 700px; height: 1037px; transform-style: preserve-3d; }
    .duo-r { left: 700px; }

    .duo-sh { position: absolute; left: 50%; top: 1037px; width: 1400px; height: 90px; margin-left: -700px; background: radial-gradient(closest-side, rgba(0,0,0,0.34), rgba(0,0,0,0)); transform-origin: 50% 50%; }

    #root { background: #fff !important; }

  </style>
  <div id="root" data-composition-id="b33" data-width="1080" data-height="1920">
    <div id="b33-st" class="st" data-layout-allow-overlap>
      <div id="e2-a" style="position:absolute;left:0;right:0;top:290px;text-align:center;font:600 80px/1.1 'SF Pro Display';letter-spacing:-0.02em;color:#86868b;" data-layout-allow-overlap>e tutto questo</div>
      <div id="e2-b" style="position:absolute;left:0;right:0;top:376px;text-align:center;font:700 150px/1.05 'SF Pro Display';letter-spacing:-0.045em;color:#1d1d1f;" data-layout-allow-overlap>solo perché…</div>
      <div id="e2-eb" style="position:absolute;left:0;right:0;top:268px;text-align:center;font:600 46px/1 'SF Pro Display';color:#b64400" data-layout-allow-overlap>Novità · appena uscito</div>
      <div id="e2-t" style="position:absolute;left:0;right:0;top:334px;text-align:center;font:700 152px/1.05 'SF Pro Display';letter-spacing:-0.045em;color:#1d1d1f;transform-origin:50% 50%" data-layout-allow-overlap>&#xF8FF; <span class="grad">iPhone Duo</span></div>
      <div class="duo" id="e2-d" data-motion-blur="off" data-layout-allow-overlap style="left:-160px;top:520px"><div class="duo-sh" id="e2-d-sh"></div><div class="duo-g" id="e2-d-g"><div class="duo-h duo-r"><div class="f in" style="background-image:url(assets/img/duo-inner-r.png)"></div><div class="f out" style="background-image:url(assets/img/duo-back.png)"></div></div><div class="duo-h duo-l" id="e2-d-l"><div class="f in" id="e2-d-li" style="background-image:url(assets/img/duo-inner-l.png)"></div><div class="f out" id="e2-d-lo" style="background-image:url(assets/img/duo-outer.png)"></div></div></div></div>
    </div>
  </div>
  <script>

    /* split .split into letters and .wsplit into words once, before the timeline is built */
    document.querySelectorAll(".split:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const txt = el.textContent; el.textContent = ""; for (const c of txt) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; el.appendChild(s); } });
    document.querySelectorAll(".wsplit:not([data-done])").forEach((el) => { el.setAttribute("data-done", "1"); const parts = el.textContent.split(" "); el.textContent = ""; parts.forEach((p, k) => { const s = document.createElement("span"); s.className = "w"; s.textContent = p + (k < parts.length - 1 ? " " : ""); el.appendChild(s); }); });
    const L = (sel) => document.querySelectorAll(sel + " .ch");
    const W = (sel) => document.querySelectorAll(sel + " .w");
    const eur = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    const flip = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0, y: 46, rotation: -24, scale: 0.55, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, rotation: 0, scale: 1, duration: 0.32, ease: "back.out(2.4)", stagger: st || 0.022 }, t);
    const rise = (tl, sel, t) => tl.fromTo(sel, { yPercent: 135 }, { yPercent: 0, duration: 0.42, ease: "expo.out" }, t);
    const sink = (tl, sel, t) => tl.to(sel, { yPercent: -150, duration: 0.2, ease: "power3.in" }, t);
    /* words arrive one after another out of a soft blur, with no travel (the premium title entrance) */
    const wordsIn = (tl, sel, t, st) => tl.fromTo(W(sel), { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: st || 0.07 }, t);
    const blurIn = (tl, sel, t, d) => tl.fromTo(sel, { opacity: 0, filter: "blur(18px)", scale: 1.06 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: d || 0.3, ease: "power2.out" }, t);
    const blurOut = (tl, sel, t, d) => tl.to(sel, { opacity: 0, filter: "blur(16px)", duration: d || 0.16, ease: "power2.in" }, t);
    const typeIn = (tl, sel, t, st) => tl.fromTo(L(sel), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: st || 0.035 }, t);
    const pop = (tl, sel, t) => tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2.4)" }, t);
    const punch = (tl, sel, t, k) => tl.fromTo(sel, { scale: k || 1.1 }, { scale: 1, duration: 0.34, ease: "expo.out", immediateRender: false }, t);
    const shake = (tl, sel, t, k) => tl.fromTo(sel, { x: -(k || 18) }, { x: 0, duration: 0.32, ease: "elastic.out(1.3, 0.3)", immediateRender: false }, t);
    const count = (tl, sel, a, b, t, d, fmt, ease) => { const o = { v: a }; const el = document.querySelector(sel); const f = fmt || eur; const u = () => { el.textContent = f(o.v); }; tl.to(o, { v: b, duration: d, ease: ease || "expo.out", onUpdate: u }, t); };
    const draw = (tl, sel, t, d) => { document.querySelectorAll(sel).forEach((el) => { const n = el.getTotalLength ? el.getTotalLength() : 1000; el.style.strokeDasharray = n + " " + (n + 60); tl.fromTo(el, { strokeDashoffset: n + 30 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.inOut" }, t); }); };
    const flash = (tl, sel, t, k) => tl.fromTo(sel, { opacity: k || 0.9 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
    /* scene transitions: U/D/L/R push, Z zoom, B blur-zoom through, N hard cut */
    const enter = (tl, sel, k) => k === "N" ? tl
      : k === "B" ? tl.fromTo(sel, { scale: 0.8, opacity: 0, filter: "blur(26px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "expo.out" }, 0)
      : k === "Z" ? tl.fromTo(sel, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0)
      : k === "U" ? tl.fromTo(sel, { y: 1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "D" ? tl.fromTo(sel, { y: -1920 }, { y: 0, duration: 0.32, ease: "expo.out" }, 0)
      : k === "R" ? tl.fromTo(sel, { x: -1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0)
      : tl.fromTo(sel, { x: 1080 }, { x: 0, duration: 0.28, ease: "expo.out" }, 0);
    const exit = (tl, sel, k, t) => k === "N" ? tl
      : k === "B" ? tl.to(sel, { scale: 1.35, opacity: 0, filter: "blur(26px)", duration: 0.2, ease: "power3.in" }, t)
      : k === "Z" ? tl.to(sel, { scale: 1.3, opacity: 0, duration: 0.18, ease: "power3.in" }, t)
      : k === "U" ? tl.to(sel, { y: -1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "D" ? tl.to(sel, { y: 1920, duration: 0.2, ease: "power3.in" }, t)
      : k === "R" ? tl.to(sel, { x: 1080, duration: 0.2, ease: "power3.in" }, t)
      : tl.to(sel, { x: -1080, duration: 0.2, ease: "power3.in" }, t);
    /* the foldable: one angle drives the hinge (0 = open flat, 180 = closed), the shading of the moving half and the re-centring of the whole phone */
    const duoSet = (id, a) => { const r = a * Math.PI / 180; const c = Math.cos(r);
      gsap.set(id + "-l", { rotationY: a });
      gsap.set(id + "-g", { x: -175 * (1 - c) });
      const li = document.querySelector(id + "-li"), lo = document.querySelector(id + "-lo");
      if (li) li.style.filter = "brightness(" + (0.55 + 0.45 * Math.max(0, c)).toFixed(3) + ")";
      if (lo) lo.style.filter = "brightness(" + (0.6 + 0.4 * Math.max(0, -c)).toFixed(3) + ")";
      const sh = document.querySelector(id + "-sh"); if (sh) sh.style.transform = "scaleX(" + (0.5 + 0.5 * (1 + c) / 2).toFixed(3) + ")"; };
    const fold = (tl, id, a0, a1, t, d, ease) => { const o = { a: a0 }; tl.to(o, { a: a1, duration: d, ease: ease || "power3.inOut", onUpdate: () => duoSet(id, o.a) }, t); };

    const tl = gsap.timeline({ paused: true });
    enter(tl, "#b33-st", "R");
    gsap.set("#e2-d", { scale: 0.62 }); gsap.set("#e2-d-g", { rotationY: 16, rotationX: 3 }); duoSet("#e2-d", 0);
    gsap.set("#e2-eb, #e2-t", { opacity: 0 }); gsap.set("#e2-t", { scale: 1.4 });
    tl.to("#e2-d", { scale: 0.8, y: 70, duration: 1.84, ease: "power2.inOut" }, 0);
    tl.to("#e2-d-g", { rotationY: -30, rotationX: 8, duration: 1.84, ease: "power2.inOut" }, 0);
    fold(tl, "#e2-d", 0, 40, 0.1, 0.5, "power2.inOut");
    fold(tl, "#e2-d", 40, 105, 1.84 - 0.9, 0.9, "power2.inOut");
    tl.fromTo("#e2-a", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 0.04);
    tl.fromTo("#e2-b", { opacity: 0, filter: "blur(12px)", scale: 1.15 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.24, ease: "expo.out" }, 0.94 - 0.14);
    tl.to("#e2-a, #e2-b", { opacity: 0, duration: 0.14 }, 1.84 - 0.4);
    tl.to("#e2-eb", { opacity: 1, duration: 0.2 }, 1.84 - 0.26);
    tl.to("#e2-t", { opacity: 1, scale: 1.1, duration: 0.26, ease: "power2.in" }, 1.84 - 0.26);
    exit(tl, "#b33-st", "N", 1.67);
    window.__timelines["b33"] = tl;
  </script>
