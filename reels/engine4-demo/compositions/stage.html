<template>
  <style>
    @font-face { font-family: "Unbounded"; font-weight: 500; src: url("assets/fonts/unbounded-latin-500-normal.woff2") format("woff2"); }
    @font-face { font-family: "Unbounded"; font-weight: 900; src: url("assets/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
    @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #st-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="stage" data-width="1080" data-height="1920">
    <canvas id="st-canvas" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      const D = FILM4.D, st = { t: 0 }, cv = document.getElementById("st-canvas");
      const q = new URLSearchParams(location.search).get("sub"); if (q) C4.quality.sub = +q;
      C4.FPS = FILM4.fps; C4.init(cv, FILM4);
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: D, duration: D, ease: "none", onUpdate: () => C4.render(st.t) }, 0);
      Promise.all([document.fonts.load('900 60px "Unbounded"'), document.fonts.load('italic 400 60px "Instrument Serif"')]).then(() => C4.render(st.t), () => C4.render(st.t));
      C4.render(0);
      window.__timelines["stage"] = tl;
    })();
  </script>
</template>
