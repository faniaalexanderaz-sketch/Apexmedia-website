<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #w-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #w-flash { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="w-canvas" width="1080" height="1920"></canvas>
    <div id="w-flash"></div>
  </div>
  <script>
    (function () {
      /* APEX "cosa facciamo" — one 3D world of marketing objects. Every frame is a pure function of t.
         140 BPM: B = 0.428571 s. Scenes start on beats 0, 6, 16, 20, 30, 40, 50, 60. */
      const B = 60 / 140, bt = (n) => n * B;
      const D = 31.6;
      const T_PROB = bt(6), T_TURN = bt(16), T_SOC = bt(20), T_STOP = bt(24), T_ADS = bt(30), T_LEAD = bt(40), T_PULL = bt(42), T_RES = bt(50), T_BRAND = bt(60);
      const T_FALL = bt(2);
      const HITS = [bt(32), bt(34), bt(36)];

      const css = getComputedStyle(document.documentElement);
      const ACC = new THREE.Color((css.getPropertyValue("--color-accent") || "#FF5A1F").trim() || "#FF5A1F");
      const WHITE = new THREE.Color(0.92, 0.92, 0.92), GREY = new THREE.Color(0.2, 0.2, 0.21), DARK = new THREE.Color(0.06, 0.06, 0.065);
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const E = {
        out: (p) => 1 - Math.pow(1 - p, 4),
        expo: (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
        in2: (p) => p * p,
        io: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
        back: (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2),
      };
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const R = rng(90210);

      /* ---------- renderer (offscreen WebGL → 2D accumulation = motion blur) ---------- */
      const out = document.querySelector("#w-canvas");
      const ctx = out.getContext("2d");
      const glc = document.createElement("canvas");
      glc.width = 1080; glc.height = 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false); renderer.setClearColor(0x000000, 1);
      renderer.autoClear = false;
      const scene = new THREE.Scene();
      const W = new THREE.Group(); scene.add(W);
      const cam = new THREE.PerspectiveCamera(60, 1080 / 1920, 0.05, 600);

      /* ---------- glossy "3D icon" material ---------- */
      const SH = { fogN: { value: 20 }, fogF: { value: 58 }, mir: { value: 0 } };
      const TAIL = `col *= 1.0 - smoothstep(uFogN, uFogF, vD); if (uMir > 0.5) col *= 0.36 * exp(-abs(vWy) * 0.13);`;
      const lit = (color, em) =>
        new THREE.ShaderMaterial({
          side: THREE.DoubleSide,
          uniforms: { uCol: { value: color.clone() }, uEm: { value: em || 0 }, uFogN: SH.fogN, uFogF: SH.fogF, uMir: SH.mir },
          vertexShader: `
            uniform vec3 uCol; varying vec3 vN; varying vec3 vV; varying vec3 vC; varying float vD; varying float vWy;
            void main(){
              vec4 p = vec4(position, 1.0); vec3 n = normal;
              #ifdef USE_INSTANCING
                p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
              #endif
              vec4 w = modelMatrix * p; vN = normalize(mat3(modelMatrix) * n); vWy = w.y;
              vV = normalize(cameraPosition - w.xyz);
              vC = uCol;
              #ifdef USE_INSTANCING_COLOR
                vC = instanceColor;
              #endif
              vec4 mv = viewMatrix * w; vD = -mv.z; gl_Position = projectionMatrix * mv;
            }`,
          fragmentShader: `
            uniform float uEm; uniform float uFogN; uniform float uFogF; uniform float uMir;
            varying vec3 vN; varying vec3 vV; varying vec3 vC; varying float vD; varying float vWy;
            void main(){
              vec3 n = normalize(vN); vec3 v = normalize(vV);
              if (dot(n, v) < 0.0) n = -n;
              vec3 L1 = normalize(vec3(0.4, 0.85, 0.5)), L2 = normalize(vec3(-0.6, 0.25, -0.5));
              float d1 = max(dot(n, L1), 0.0), d2 = max(dot(n, L2), 0.0);
              float sp = pow(max(dot(n, normalize(L1 + v)), 0.0), 56.0);
              float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0);
              vec3 col = vC * (0.17 + 0.80 * d1 + 0.24 * d2) + vec3(sp) * 0.6 + vC * rim * 0.55 + vec3(rim) * 0.10;
              col = mix(col, vC, uEm);
              ${TAIL}
              gl_FragColor = vec4(col, 1.0);
            }`,
        });

      const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), eu = new THREE.Euler(), col = new THREE.Color();

      /* ---------- A) hearts (likes) ---------- */
      const N1 = 240, N2 = 70;
      const heartGeo = (function () {
        const pts = [];
        for (let i = 0; i < 44; i++) {
          const a = (i / 44) * Math.PI * 2;
          pts.push(new THREE.Vector2((16 * Math.pow(Math.sin(a), 3)) / 17, (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17 + 0.12));
        }
        const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: 0.34, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.13, bevelSegments: 4, curveSegments: 8 });
        g.translate(0, 0, -0.17);
        return g;
      })();
      const hearts = new THREE.InstancedMesh(heartGeo, lit(WHITE), N1 + N2);
      hearts.frustumCulled = false; W.add(hearts);
      const hr = new Float32Array((N1 + N2) * 8);
      for (let i = 0; i < hr.length; i++) hr[i] = R();
      for (let i = 0; i < N1 + N2; i++) hearts.setColorAt(i, WHITE);

      /* ---------- B) phone ---------- */
      const PH = new THREE.Vector3(70, 5.4, 0);
      const phone = new THREE.Group(); W.add(phone);
      const PW = 4.3, PHh = 8.8;
      {
        const rr = (w, h, r) => { const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
          s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
        const g = new THREE.ExtrudeGeometry(rr(PW, PHh, 0.62), { depth: 0.36, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.07, bevelSegments: 3, curveSegments: 10 });
        g.translate(0, 0, -0.18);
        phone.add(new THREE.Mesh(g, lit(new THREE.Color(0.16, 0.16, 0.17))));
      }
      const scrMat = new THREE.ShaderMaterial({
        uniforms: { uScroll: { value: 0 }, uHot: { value: 0 }, uHotIdx: { value: 20 }, uOn: { value: 0 }, uAcc: { value: ACC.clone() }, uFogN: SH.fogN, uFogF: SH.fogF, uMir: SH.mir },
        vertexShader: `varying vec2 vUv; varying float vD; varying float vWy;
          void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vWy = w.y; vec4 mv = viewMatrix * w; vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `uniform float uScroll; uniform float uHot; uniform float uHotIdx; uniform float uOn; uniform vec3 uAcc; uniform float uFogN; uniform float uFogF; uniform float uMir;
          varying vec2 vUv; varying float vD; varying float vWy;
          float box(vec2 p, vec2 a, vec2 b){ return step(a.x, p.x) * step(p.x, b.x) * step(a.y, p.y) * step(p.y, b.y); }
          void main(){
            float y = vUv.y * 4.0 + uScroll; float idx = floor(y); vec2 p = vec2(vUv.x, fract(y));
            float card = box(p, vec2(0.05, 0.05), vec2(0.95, 0.95));
            float img = box(p, vec2(0.05, 0.30), vec2(0.95, 0.95));
            float l1 = box(p, vec2(0.10, 0.17), vec2(0.62, 0.225));
            float l2 = box(p, vec2(0.10, 0.09), vec2(0.40, 0.135));
            float hrt = 1.0 - smoothstep(0.035, 0.05, distance(p * vec2(1.0, 0.5), vec2(0.86, 0.085)));
            float hot = uHot * (1.0 - step(0.5, abs(idx - uHotIdx)));
            float tone = 0.5 + 0.5 * fract(sin(idx * 12.9898) * 43758.5453);
            vec3 c = vec3(0.035) + vec3(0.07) * card + vec3(0.15) * img * tone + vec3(0.42) * (l1 + l2) * card + vec3(0.6) * hrt * card;
            vec3 hc = uAcc * (0.55 * card + 0.45 * img) + vec3(1.0) * (l1 + l2 + hrt) * card;
            vec3 col = mix(c, hc, hot);
            col = mix(col, uAcc, uOn);
            ${TAIL}
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(PW - 0.42, PHh - 0.42), scrMat);
      screen.position.z = 0.262; phone.add(screen);
      const popMat = lit(ACC, 0.55);
      const pop = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.85, 0.16), popMat); phone.add(pop);

      /* ---------- C) target + arrows + audience ---------- */
      const TG = new THREE.Vector3(140, 5.3, 0);
      const target = new THREE.Group(); target.position.copy(TG); W.add(target);
      const rings = [];
      {
        const back = new THREE.CylinderGeometry(5.5, 5.5, 0.3, 64); back.rotateZ(Math.PI / 2); back.translate(0.35, 0, 0);
        target.add(new THREE.Mesh(back, lit(new THREE.Color(0.09, 0.09, 0.1))));
        [4.7, 3.5, 2.3, 1.1].forEach((r, i) => {
          const g = new THREE.TorusGeometry(r, 0.46, 14, 72); g.rotateY(Math.PI / 2);
          const mesh = new THREE.Mesh(g, lit(i % 2 === 0 ? WHITE : ACC, i % 2 ? 0.15 : 0)); target.add(mesh); rings.push(mesh);
        });
        const c = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 16), lit(ACC, 0.3)); c.position.x = -0.1; target.add(c); rings.push(c);
      }
      const arrows = [];
      for (let k = 0; k < 3; k++) {
        const g = new THREE.Group();
        const shaft = new THREE.CylinderGeometry(0.075, 0.075, 3.6, 10); shaft.rotateZ(-Math.PI / 2); shaft.translate(-1.8, 0, 0);
        g.add(new THREE.Mesh(shaft, lit(WHITE)));
        const tip = new THREE.ConeGeometry(0.2, 0.7, 14); tip.rotateZ(-Math.PI / 2); tip.translate(0.25, 0, 0);
        g.add(new THREE.Mesh(tip, lit(ACC, 0.3)));
        [0, Math.PI / 2].forEach((a) => { const f = new THREE.BoxGeometry(0.9, 0.62, 0.03); f.rotateX(a); f.translate(-3.25, 0, 0); g.add(new THREE.Mesh(f, lit(ACC, 0.3))); });
        W.add(g); arrows.push(g);
      }
      const HITP = [[0.35, 0.3], [-0.4, -0.25], [0.02, 0.04]]; // (dy, dz) on the bullseye

      /* ---------- D) magnet + contacts (pawns) ---------- */
      const MG = new THREE.Vector3(210, 10.5, 0);
      const magnet = new THREE.Group(); W.add(magnet);
      {
        const s = new THREE.Shape();
        s.moveTo(-2.5, -2.4); s.lineTo(-2.5, 0); s.absarc(0, 0, 2.5, Math.PI, 0, true); s.lineTo(2.5, -2.4); s.lineTo(1.15, -2.4); s.lineTo(1.15, 0); s.absarc(0, 0, 1.15, 0, Math.PI, false); s.lineTo(-1.15, -2.4); s.lineTo(-2.5, -2.4);
        const g = new THREE.ExtrudeGeometry(s, { depth: 1.2, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.09, bevelSegments: 3, curveSegments: 28 });
        g.translate(0, 0, -0.6);
        magnet.add(new THREE.Mesh(g, lit(ACC, 0.12)));
        [-1.825, 1.825].forEach((x) => { const t = new THREE.BoxGeometry(1.55, 1.0, 1.42); t.translate(x, -2.9, 0); magnet.add(new THREE.Mesh(t, lit(WHITE))); });
      }
      const NPA = 130, NPW = 256, NPN = NPA + NPW;
      const pawnGeo = (function () {
        const p = [new THREE.Vector2(0, 0), new THREE.Vector2(0.44, 0), new THREE.Vector2(0.47, 0.1), new THREE.Vector2(0.22, 0.92), new THREE.Vector2(0.15, 1.02)];
        for (let i = 0; i <= 10; i++) { const a = -1.15 + (i / 10) * (Math.PI / 2 + 1.15); p.push(new THREE.Vector2(Math.cos(a) * 0.33, 1.36 + Math.sin(a) * 0.33)); }
        return new THREE.LatheGeometry(p, 18);
      })();
      const pawns = new THREE.InstancedMesh(pawnGeo, lit(GREY), NPN);
      pawns.frustumCulled = false; W.add(pawns);
      const pr = new Float32Array(NPN * 6);
      for (let i = 0; i < pr.length; i++) pr[i] = R();
      for (let i = 0; i < NPN; i++) pawns.setColorAt(i, GREY);

      /* ---------- E) growth arrow ---------- */
      const GX = 280, G_TOP = 47;
      const gCurve = (function () {
        const pts = [];
        for (let i = 0; i <= 80; i++) { const u = i / 80, a = u * 3.1 * Math.PI * 2, r = 6.5 - 4.0 * u; pts.push(new THREE.Vector3(GX + Math.cos(a) * r, 0.6 + u * (G_TOP - 0.6), Math.sin(a) * r)); }
        return new THREE.CatmullRomCurve3(pts);
      })();
      const G_SEG = 420, G_RAD = 10;
      const gGeo = new THREE.TubeGeometry(gCurve, G_SEG, 0.5, G_RAD, false);
      const growth = new THREE.Mesh(gGeo, lit(ACC, 0.22)); growth.frustumCulled = false; W.add(growth);
      const gHeadGeo = new THREE.ConeGeometry(1.25, 3.0, 20); gHeadGeo.translate(0, 1.0, 0);
      const gHead = new THREE.Mesh(gHeadGeo, lit(ACC, 0.22)); W.add(gHead);
      const growP = (t) => Math.pow(seg(t, T_RES + 0.05, T_BRAND - 0.25), 1.35);
      const UP = new THREE.Vector3(0, 1, 0), hp = new THREE.Vector3(), ht = new THREE.Vector3();

      /* ---------- F) logo ---------- */
      const LOGO = new THREE.Vector3(GX, 60, 0);
      const logo = new THREE.Group();
      {
        const S = 0.27, cx = 15, cy = 18;
        const P = (x, y) => new THREE.Vector2((x - cx) * S, (cy - y) * S);
        const tri = [[15, 3], [27.5, 29], [2.5, 29]], inc = [15, 21.14];
        const sc = (k) => tri.map((p) => P(inc[0] + (p[0] - inc[0]) * k, inc[1] + (p[1] - inc[1]) * k));
        const outer = new THREE.Shape(sc(1.165)); outer.holes.push(new THREE.Path(sc(0.835).reverse()));
        const inner = new THREE.Shape([P(15, 13.5), P(20, 24), P(10, 24)]);
        const opt = { depth: 0.9, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 3 };
        const mat = lit(ACC, 0.3);
        [outer, inner].forEach((sh) => { const g = new THREE.ExtrudeGeometry(sh, opt); g.translate(0, 0, -0.45); logo.add(new THREE.Mesh(g, mat)); });
        logo.position.copy(LOGO);
      }
      W.add(logo);

      /* ---------- sparks ---------- */
      const EV = [];
      const addEv = (te, ox, oy, oz, vx, vy, vz, life, kind, g) => EV.push(te, ox, oy, oz, vx, vy, vz, life, kind, g);
      for (let i = 0; i < 260; i++) addEv(T_FALL + 0.35 + R() * 0.35, (R() - 0.5) * 15, 0.1, -13 + R() * 19, (R() - 0.5) * 7, 1 + R() * 6, (R() - 0.5) * 7, 0.6 + R() * 0.5, 0, 9);
      HITS.forEach((th, k) => { for (let i = 0; i < 110; i++) { const a = R() * 6.283, s = 2 + R() * 10; addEv(th, TG.x - 0.5, TG.y + HITP[k][0], HITP[k][1], -3 - R() * 12, Math.cos(a) * s, Math.sin(a) * s, 0.5 + R() * 0.5, R() < 0.35 ? 2 : 1, 6); } });
      for (let i = 0; i < 260; i++) { const a = R() * 6.283, s = 4 + R() * 16; addEv(T_PULL, MG.x, 0.2, 0, Math.cos(a) * s, R() * 3, Math.sin(a) * s, 0.7 + R() * 0.5, 1, 4); }
      for (let i = 0; i < 700; i++) { const a = R() * 6.283, cz = R() * 2 - 1, sz = Math.sqrt(1 - cz * cz), s = 7 + R() * 26; addEv(T_BRAND, LOGO.x, LOGO.y, LOGO.z - 1.5, Math.cos(a) * sz * s, Math.sin(a) * sz * s * 1.2, cz * s * 0.5 - 2, 9, R() < 0.3 ? 2 : 1, 0); }
      const NP = EV.length / 10, ev = new Float32Array(EV);
      const pPos = new Float32Array(NP * 3), pCol = new Float32Array(NP * 4), pSize = new Float32Array(NP);
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
      pGeo.setAttribute("aCol", new THREE.BufferAttribute(pCol, 4));
      pGeo.setAttribute("aSize", new THREE.BufferAttribute(pSize, 1));
      const pMat = new THREE.ShaderMaterial({
        uniforms: { uScale: { value: 1700 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        vertexShader: `attribute vec4 aCol; attribute float aSize; uniform float uScale; varying vec4 vCol;
          void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); float d = max(-mv.z, 0.01);
            vCol = vec4(aCol.rgb, aCol.a * smoothstep(0.3, 2.0, d)); gl_PointSize = clamp(aSize * uScale / d, 1.5, 40.0); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `varying vec4 vCol; void main(){ float r = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.2, r); if (a * vCol.a < 0.004) discard; gl_FragColor = vec4(vCol.rgb, vCol.a * a); }`,
      });
      const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; W.add(points);
      function sparks(t) {
        for (let i = 0; i < NP; i++) {
          const o = i * 10, tau = t - ev[o], life = ev[o + 7], kind = ev[o + 8];
          let a = 0;
          if (tau > 0 && tau < life) {
            const k = (1 - Math.exp(-2.6 * tau)) / 2.6;
            pPos[i * 3] = ev[o + 1] + ev[o + 4] * k;
            pPos[i * 3 + 1] = ev[o + 9] > 0 ? Math.max(0.05, ev[o + 2] + ev[o + 5] * k - 0.5 * ev[o + 9] * tau * tau) : ev[o + 2] + ev[o + 5] * k;
            pPos[i * 3 + 2] = ev[o + 3] + ev[o + 6] * k;
            a = life > 5 ? 0.9 - 0.62 * seg(tau, 0.2, 1.3) : 1 - tau / life;
          }
          pCol[i * 4] = kind === 1 ? ACC.r : kind === 2 ? 1 : 0.7; pCol[i * 4 + 1] = kind === 1 ? ACC.g + 0.15 : kind === 2 ? 1 : 0.7; pCol[i * 4 + 2] = kind === 1 ? ACC.b : kind === 2 ? 1 : 0.7; pCol[i * 4 + 3] = a;
          pSize[i] = kind === 0 ? 0.09 : 0.08;
        }
        pGeo.attributes.position.needsUpdate = true; pGeo.attributes.aCol.needsUpdate = true; pGeo.attributes.aSize.needsUpdate = true;
      }

      /* ---------- per-frame object state ---------- */
      function phonePose(t) {
        const turn = E.io(seg(t, T_TURN, T_TURN + 0.95));
        const wob = Math.sin(t * 1.3) * 0.22 * (1 - seg(t, T_TURN - 0.2, T_TURN)) ;
        phone.position.set(PH.x, PH.y + 0.25 * Math.sin(t * 1.7), PH.z);
        phone.rotation.set(-0.1 + 0.05 * Math.sin(t * 1.1), wob + turn * Math.PI * 2, 0.06 * Math.sin(t * 0.9));
        const jolt = 1 + 0.07 * Math.exp(-Math.max(0, t - T_STOP) * 9) * (t >= T_STOP ? 1 : 0);
        phone.scale.setScalar(jolt);
        phone.updateMatrix();
        const sSoc = 18.5 - 16 * Math.pow(1 - seg(t, T_SOC - 0.2, T_STOP), 2.2);
        scrMat.uniforms.uScroll.value = t < T_SOC - 0.2 ? 2.5 + 0.55 * t : sSoc;
        scrMat.uniforms.uHot.value = seg(t, T_STOP - 0.04, T_STOP + 0.08);
        scrMat.uniforms.uOn.value = t >= T_TURN ? Math.exp(-(t - T_TURN) * 3.2) * 0.95 : 0;
        const pp = seg(t, T_STOP + 0.1, T_STOP + 0.6);
        pop.visible = pp > 0;
        pop.position.set(0, 0, 0.3 + 0.95 * E.back(pp));
        pop.scale.setScalar(0.9 + 0.2 * E.back(pp));
        pop.rotation.set(0, 0.18 * Math.sin((t - T_STOP) * 2.2) * pp, 0);
      }
      function heartsUpdate(t) {
        for (let i = 0; i < N1; i++) {
          const o = i * 8, s = 0.45 + hr[o + 3] * 0.75;
          const x = (hr[o] - 0.5) * 17, z = -19 + hr[o + 1] * 17, v = 3.2 + hr[o + 2] * 4.5;
          const tt = Math.min(t, T_FALL);
          const y0 = ((hr[o + 4] * 15 + v * (tt + 5)) % 15) + 0.4;
          let y = y0, flat = 0, grey = 0;
          if (t > T_FALL) {
            const tau = t - T_FALL, g = 34, r = 0.42 * s;
            const vi = Math.sqrt(v * v + 2 * g * Math.max(0, y0 - r)), t1 = (v + vi) / g;
            if (tau < t1) y = y0 + v * tau - 0.5 * g * tau * tau;
            else { const v2 = 0.36 * vi, t2 = (2 * v2) / g, ta = tau - t1; y = ta < t2 ? r + v2 * ta - 0.5 * g * ta * ta : r; flat = seg(ta, 0, t2 + 0.1); }
            grey = seg(tau, 0, 0.3);
          }
          const sp = Math.min(t, T_FALL + 0.9);

          eu.set(0, phone.rotation.y + (hr[o + 3] - 0.5), (hr[o + 4] - 0.5) * 0.8 + u);
          q4.setFromEuler(eu); s3.setScalar(live * Math.sin(Math.PI * Math.min(1, u * 1.15)) * (0.35 + hr[o + 5] * 0.4));
          m4.compose(v3, q4, s3); hearts.setMatrixAt(i, m4);
          col.copy(hr[o + 6] < 0.3 ? ACC : WHITE); hearts.setColorAt(i, col);
        }
        hearts.instanceMatrix.needsUpdate = true; hearts.instanceColor.needsUpdate = true;
      }
      function targetUpdate(t) {
        let pulse = 0;
        HITS.forEach((th) => { if (t >= th) pulse += Math.exp(-(t - th) * 9); });
        target.rotation.set(0, -0.12 + 0.1 * Math.sin(t * 0.8), 0.04 * Math.sin(t * 1.9) + pulse * 0.05);
        const pin = E.back(seg(t, T_ADS - 0.25, T_ADS + 0.3));
        target.scale.setScalar(Math.max(0.001, pin) * (1 + pulse * 0.06));
        rings.forEach((r, i) => { const s = 1 + pulse * 0.1 * (i + 1) * 0.5; r.scale.set(1, s, s); r.position.x = -pulse * 0.35 * (i < 4 ? 1 : 0.4); });
        for (let k = 0; k < 3; k++) {
          const th = HITS[k], fl = seg(t, th - 0.32, th), a = arrows[k];
          a.visible = fl > 0 && t < T_LEAD + 0.5;
          const hx = TG.x - 0.75, hy = TG.y + HITP[k][0], hz = HITP[k][1];
          const sx = 112, sy = 8.5 + k * 1.2, sz = 6 - k * 5;
          const p = fl;
          const wob = t >= th ? Math.exp(-(t - th) * 10) * Math.sin((t - th) * 60) * 0.09 : 0;
          a.position.set(lerp(sx, hx, p), lerp(sy, hy, p), lerp(sz, hz, p));
          const dx = hx - sx, dy = hy - sy, dz = hz - sz;

      }
      function pawnsUpdate(t) {
        const hitN = (t >= HITS[0] ? 1 : 0) + (t >= HITS[1] ? 1 : 0) + (t >= HITS[2] ? 1 : 0);
        for (let i = 0; i < NPA; i++) {
          const o = i * 6, x = 146 + pr[o] * 26, z = (pr[o + 1] - 0.5) * (14 + pr[o] * 26);
          const grp = i % 3, on = grp < hitN ? seg(t, HITS[grp] + pr[o + 2] * 0.25, HITS[grp] + pr[o + 2] * 0.25 + 0.15) : 0;
          const hop = on > 0 ? Math.abs(Math.sin(Math.min(1, (t - HITS[grp] - pr[o + 2] * 0.25) / 0.4) * Math.PI)) * 0.9 : 0;
          v3.set(x, hop, z); q4.identity(); s3.setScalar(0.95 + pr[o + 3] * 0.5); m4.compose(v3, q4, s3); pawns.setMatrixAt(i, m4);
          col.copy(GREY).lerp(ACC, on); pawns.setColorAt(i, col);
        }
        for (let j = 0; j < NPW; j++) {
          const i = NPA + j, o = i * 6;
          const a0 = pr[o] * 6.283, r0 = 7 + pr[o + 1] * 19;

          v3.set(lerp(wx, tx, p), hop, lerp(wz, tz, p)); q4.identity(); s3.setScalar(0.9 + pr[o + 3] * 0.2 * (1 - p)); m4.compose(v3, q4, s3); pawns.setMatrixAt(i, m4);

        const drop = E.back(seg(t, T_LEAD - 0.2, T_LEAD + 0.4));
        magnet.position.set(MG.x + on * 0.07 * Math.sin(t * 61), MG.y + (1 - drop) * 14 + 0.3 * Math.sin(t * 1.5), MG.z + on * 0.07 * Math.sin(t * 53));
        magnet.rotation.set(0.12 * Math.sin(t * 1.2), 0.5 * Math.sin(t * 0.7) + (1 - drop) * 3, 0.08 * Math.sin(t * 1.6));
      }
      function growthUpdate(t) {
        const p = growP(t);
        growth.visible = p > 0.002;
        gHead.visible = growth.visible;
        if (!growth.visible) return;
        gGeo.setDrawRange(0, Math.floor(G_SEG * p) * G_RAD * 6);
        gCurve.getPointAt(Math.min(0.9999, p), hp); gCurve.getTangentAt(Math.min(0.9999, p), ht);
        gHead.position.copy(hp); gHead.quaternion.setFromUnitVectors(UP, ht.normalize());
      }

      /* ---------- camera ---------- */
      const pose = { p: [0, 0, 0], l: [0, 0, 0], roll: 0, fov: 60 };
      const A = { p: [0, 0, 0], l: [0, 0, 0], roll: 0, fov: 60 }, Bq = { p: [0, 0, 0], l: [0, 0, 0], roll: 0, fov: 60 };
      function cHook(t, o) {
        const d = E.io(seg(t, T_FALL, T_FALL + 0.55));
        o.p[0] = 0.6 * Math.sin(t * 1.2); o.p[1] = lerp(3.4, 1.3, d); o.p[2] = lerp(10.5, 8.5, d) - t * 0.5;
        o.l[0] = 0; o.l[1] = lerp(7.2, 2.0, d); o.l[2] = -3; o.roll = lerp(-8, 3, d); o.fov = lerp(72, 62, d);
      }
      function cPhone(t, o) {
        const pr1 = seg(t, T_PROB, T_TURN), tn = E.out(seg(t, T_TURN, T_TURN + 0.5)), so = E.io(seg(t, T_SOC - 0.1, T_SOC + 0.7)), pk = E.io(seg(t, T_STOP, T_STOP + 0.7));
        const a = lerp(-0.6, 0.2, pr1) + so * 0.38 - pk * 0.15, r = lerp(14.5, 12.0, pr1) + tn * 3.5 - so * 6.8 - pk * 0.6;
        o.p[0] = PH.x + Math.sin(a) * r; o.p[1] = 6.2 - so * 0.4; o.p[2] = Math.cos(a) * r;
        o.l[0] = PH.x; o.l[1] = lerp(8.0, 6.9, so); o.l[2] = 0; o.roll = 5 * Math.sin(t * 1.1) * (1 - so); o.fov = 60;
      }
      function cAds(t, o) {
        const u = seg(t, T_ADS, T_LEAD), push = E.io(seg(t, HITS[2] - 0.3, HITS[2] + 0.1));
        o.p[0] = 121.5 + 2.5 * u + 3.0 * push; o.p[1] = 5.9 + 0.5 * Math.sin(t * 1.3); o.p[2] = lerp(6.5, -5.0, u);
        o.l[0] = TG.x; o.l[1] = 7.9 - 1.6 * push; o.l[2] = 0; o.roll = 6 * Math.sin((t - T_ADS) * 1.5); o.fov = 60;
      }
      function cLead(t, o) {
        const u = seg(t, T_LEAD, T_RES), a = lerp(-0.55, 0.45, u), r = lerp(27, 22, E.out(u));
        o.p[0] = MG.x + Math.sin(a) * r; o.p[1] = lerp(13.5, 10.5, u); o.p[2] = Math.cos(a) * r;
        o.l[0] = MG.x; o.l[1] = 7.4; o.l[2] = 0; o.roll = -5 * Math.sin((t - T_LEAD) * 1.2); o.fov = 60;
      }
      function cRes(t, o) {
        const p = Math.min(0.9999, Math.max(0.0005, growP(t)));
        gCurve.getPointAt(p, hp);
        const ah = Math.atan2(hp.z, hp.x - GX) - 0.95, rh = Math.hypot(hp.x - GX, hp.z) + 8.0;
        o.p[0] = GX + Math.cos(ah) * rh; o.p[1] = hp.y + 2.4 + 2.0 * (1 - p); o.p[2] = Math.sin(ah) * rh;
        o.l[0] = lerp(hp.x, GX, 0.5); o.l[1] = hp.y + 3.6; o.l[2] = hp.z * 0.5; o.roll = 9 * Math.sin((t - T_RES) * 1.6); o.fov = 64;
      }
      function cBrand(t, o) { o.p[0] = GX; o.p[1] = LOGO.y; o.p[2] = 16.6; o.l[0] = GX; o.l[1] = LOGO.y - 4.6; o.l[2] = 0; o.roll = 0; o.fov = 54; }
      function mix(o, a, b, w) { for (let i = 0; i < 3; i++) { o.p[i] = lerp(a.p[i], b.p[i], w); o.l[i] = lerp(a.l[i], b.l[i], w); } o.roll = lerp(a.roll, b.roll, w); o.fov = lerp(a.fov, b.fov, w); }
      const CUTS = [[cHook, cPhone, T_PROB - 0.34, T_PROB + 0.14], [cPhone, cAds, T_ADS - 0.34, T_ADS + 0.14], [cAds, cLead, T_LEAD - 0.34, T_LEAD + 0.14], [cLead, cRes, T_RES - 0.34, T_RES + 0.14], [cRes, cBrand, T_BRAND - 0.5, T_BRAND]];
      function setCamera(t) {
        let done = false;

          const c = CUTS[i];

          else if (t < c[3]) { c[0](t, A); c[1](t, Bq); mix(pose, A, Bq, i === 4 ? E.in2(seg(t, c[2], c[3])) : E.io(seg(t, c[2], c[3]))); done = true; }

        cam.rotateZ((pose.roll * Math.PI) / 180); cam.fov = pose.fov; cam.updateProjectionMatrix();
      }

      function draw(t) {
        setCamera(t);
        phonePose(t); heartsUpdate(t); targetUpdate(t); pawnsUpdate(t); growthUpdate(t); sparks(t);
        pMat.uniforms.uScale.value = 960 / Math.tan((cam.fov * Math.PI) / 360);
