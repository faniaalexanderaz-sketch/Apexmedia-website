<template>
  <style>
    @font-face { font-family: "Big Shoulders Display"; font-weight: 900; src: url("assets/fonts/big-shoulders-display-latin-900-normal.woff2") format("woff2"); }

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
      const num = document.querySelector("#tf-num"); const c = { v: 0 };
      tl.fromTo(".tf-w", { rotationX: -90, opacity: 0 }, { rotationX: 0, opacity: 1, duration: 0.4, ease: "expo.out", stagger: 0.08, transformOrigin: "50% 0%" }, 0.1);

      tl.fromTo(c, { v: 0 }, { v: 10000, duration: 1.5, ease: "power3.out", onUpdate: () => (num.textContent = fmt(c.v)) }, 0.25);
      tl.fromTo("#tf-cc", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.7);

      tl.fromTo("#tf-n", { opacity: 1 }, { opacity: 0.28, duration: 0.3, ease: "power2.out" }, 2.2);
      // exit: recedes with the camera pull-back
      tl.fromTo("#root", { scale: 1, opacity: 1, filter: "blur(0px)" }, { scale: 0.45, opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in", transformOrigin: "50% 40%" }, 3.6);
      num.textContent = "0";

      window.__timelines["t-traffico"] = tl;
    })();
