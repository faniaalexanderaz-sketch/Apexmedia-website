<!doctype html>
<html
  lang="it"
  data-composition-variables='[
    {"id":"color-accent","type":"color","label":"Fluo principale","default":"#C8FF00"},
    {"id":"color-problem","type":"color","label":"Fluo problema","default":"#FF2D78"},
    {"id":"color-ink","type":"color","label":"Testo","default":"#FFFFFF"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <script src="assets/vendor/three.min.js"></script>
    <style>
      :root {
        --color-accent: #c8ff00;
        --color-problem: #ff2d78;
        --color-ink: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920">
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html" data-start="0" data-duration="21" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="t-hook" data-composition-id="t-hook" data-composition-src="compositions/t-hook.html" data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="t-traffico" data-composition-id="t-traffico" data-composition-src="compositions/t-traffico.html" data-start="4" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>

      <audio id="sfx-whoosh-2" src="assets/audio/whoosh.mp3" data-start="7.4" data-duration="2.2" data-volume="0.55" data-track-index="3"></audio>
      <audio id="sfx-whoosh-3" src="assets/audio/whoosh.mp3" data-start="11.9" data-duration="2.2" data-volume="0.45" data-track-index="3"></audio>
      <audio id="sfx-swish-2" src="assets/audio/swish.mp3" data-start="16.48" data-duration="0.3" data-volume="0.7" data-track-index="3"></audio>
      <audio id="sfx-hit" src="assets/audio/hit.mp3" data-start="18" data-duration="3" data-volume="0.5" data-fade-out="1.2" data-track-index="4"></audio>

      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
