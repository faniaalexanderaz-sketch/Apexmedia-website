<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: var(--font-display), sans-serif;
      color: var(--color-ink);
    }
    #hook-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 1080px;
      height: 1920px;
    }
    #hook-title {
      position: absolute;
      left: 80px;
      top: 300px;
      width: 920px;
    }
    .hook-line {
      display: block;
      font-weight: 900;
      font-size: 128px;
      line-height: 1.02;
      letter-spacing: -0.04em;
    }
    .hook-acc {
      font-family: var(--font-accent), serif;
      font-style: italic;
      font-weight: 800;
      font-size: 156px;
      letter-spacing: -0.01em;
      color: var(--color-gold);
    }
    .hook-w {
      display: inline-block;
    }
    #hook-label {
      position: absolute;
      left: 80px;
      top: 760px;
      font-weight: 600;
      font-size: 40px;
      color: var(--color-muted);
    }
    #hook-zero {
      position: absolute;
      left: 800px;
      top: 960px;
      width: 200px;
      text-align: right;
      font-weight: 900;
      font-size: 64px;
      letter-spacing: -0.03em;
      color: var(--color-orange);
    }
    .hook-axis {
      position: absolute;
      top: 1262px;
      font-weight: 600;
      font-size: 32px;
      color: var(--color-muted);
    }
    #hook-gen {
      left: 80px;
    }
    #hook-dic {
      left: 920px;
      width: 80px;
      text-align: right;
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <canvas id="hook-canvas" width="1080" height="1920"></canvas>
    <div id="hook-title">
      <span class="hook-line"><span class="hook-w">Il</span> <span class="hook-w">tuo</span> <span class="hook-w">fatturato</span></span>
      <span class="hook-line"><span class="hook-w">è</span> <span class="hook-w hook-acc">fermo?</span></span>
    </div>
    <div id="hook-label">Fatturato mensile</div>
    <div id="hook-zero">+0%</div>
    <div id="hook-gen" class="hook-axis">Gen</div>
    <div id="hook-dic" class="hook-axis">Dic</div>
  </div>
  <script>
    (function () {
      const D = 3.2;
      const cv = document.querySelector("#hook-canvas");
      const ctx = cv.getContext("2d");

      // seeded RNG — deterministic
      function rng(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = rng(7);
      const N = 44;
      const dots = [];
      for (let i = 0; i < N; i++) {
        dots.push({
          x: 100 + (i * 880) / (N - 1),
          y: 1130 + (r() - 0.5) * 14,
          d: r() * 0.18,
          sp: 0.85 + r() * 0.4,
        });
      }
      const clamp = (v) => Math.max(0, Math.min(1, v));
      const expoOut = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));
      const p3in = (p) => p * p * p;

      function draw(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        // baseline
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#AFAFBC";
        ctx.fillRect(80, 1240, 920, 2);
        ctx.globalAlpha = 1;
        for (let i = 0; i < N; i++) {
          const d = dots[i];
          const appear = expoOut(clamp((t - (i / N) * 1.2) / 0.35));
          if (appear <= 0) continue;
          // fly-up after 2.35s
          const fp = clamp((t - 2.35 - d.d) / 0.85);
          const lift = p3in(fp) * 1500 * d.sp;
          const vel = fp > 0 ? 3 * fp * fp * 1500 * d.sp : 0; // px per unit progress
          const y = d.y - lift;
          // colour shifts grey -> brand blue as they launch
          const c = clamp(fp * 3);
          const R = Math.round(175 + (30 - 175) * c);
          const G = Math.round(175 + (79 - 175) * c);
          const B = Math.round(188 + (216 - 188) * c);
          ctx.fillStyle = "rgb(" + R + "," + G + "," + B + ")";
          ctx.globalAlpha = 0.9 * appear;
          const rad = 8 * appear;
          const streak = Math.min(220, vel * 0.03);
          ctx.beginPath();
          if (streak > 2) {
            ctx.roundRect(d.x - rad, y - rad, rad * 2, rad * 2 + streak, rad);
          } else {
            ctx.arc(d.x, y, rad, 0, Math.PI * 2);
          }
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: D, duration: D, ease: "none", onUpdate: () => draw(st.t) }, 0);

      // "+0%" lands where the flat line ends
      tl.fromTo("#hook-zero", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 1.25);
      // "fermo?" gets one hard horizontal knock as the line flatlines
      tl.fromTo(".hook-acc", { x: 0 }, { x: -18, duration: 0.06, ease: "power2.out" }, 1.5);
      tl.to(".hook-acc", { x: 0, duration: 0.35, ease: "expo.out" }, 1.56);

      // exit: everything blurs out word by word as dots launch
      tl.to(".hook-w", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in", stagger: 0.04 }, 2.45);
      tl.to(["#hook-label", "#hook-zero", ".hook-axis"], { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power2.in" }, 2.4);

      draw(0);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
